        };

        // --- CO2 EMISSION FACTORS (kg CO2 per L or kWh) ---
        const co2Factors = {
            petrol: 2.31,
            diesel: 2.68,
            hybrid: 1.60,
            electric: 0.45
        };

        // --- DOM ELEMENTS ---
        const regionSelect = document.getElementById('regionSelect');
        const currencySelect = document.getElementById('currencySelect');
        const themeToggle = document.getElementById('themeToggle');
        
        const inputOrigin = document.getElementById('inputOrigin');
        const inputDestination = document.getElementById('inputDestination');
        const originSuggestions = document.getElementById('originSuggestions');
        const destSuggestions = document.getElementById('destSuggestions');
        const btnCalculateRoute = document.getElementById('btnCalculateRoute');
        const routeStatusBadge = document.getElementById('routeStatusBadge');
        
        const inputDistance = document.getElementById('inputDistance');
        const checkRoundTrip = document.getElementById('checkRoundTrip');
        
        const presetVehicle = document.getElementById('presetVehicle');
        const fuelType = document.getElementById('fuelType');
        const inputConsumption = document.getElementById('inputConsumption');
        const inputFuelPrice = document.getElementById('inputFuelPrice');
        const lblConsumption = document.getElementById('lblConsumption');
        const unitConsumption = document.getElementById('unitConsumption');
        const lblFuelPrice = document.getElementById('lblFuelPrice');
        const unitFuelPrice = document.getElementById('unitFuelPrice');
        
        const inputTolls = document.getElementById('inputTolls');
        const inputWearRate = document.getElementById('inputWearRate');
        const rangePassengers = document.getElementById('rangePassengers');
        const lblPassengers = document.getElementById('lblPassengers');
        
        const timeframeSelect = document.getElementById('timeframeSelect');
        const customDaysContainer = document.getElementById('customDaysContainer');
        const inputCustomDays = document.getElementById('inputCustomDays');
        const rangeTraffic = document.getElementById('rangeTraffic');
        const lblTrafficMargin = document.getElementById('lblTrafficMargin');
        
        const resTotalCost = document.getElementById('resTotalCost');
        const resPerPersonCost = document.getElementById('resPerPersonCost');
        const resSplitDesc = document.getElementById('resSplitDesc');
        const resTotalFuel = document.getElementById('resTotalFuel');
        const resFuelUnit = document.getElementById('resFuelUnit');
        const resCostPerKmDesc = document.getElementById('resCostPerKmDesc');
        const resTotalDistanceDesc = document.getElementById('resTotalDistanceDesc');
        const resCarbonFootprint = document.getElementById('resCarbonFootprint');
        const outputTimeframeBadge = document.getElementById('outputTimeframeBadge');

        const barFuel = document.getElementById('barFuel');
        const barTolls = document.getElementById('barTolls');
        const barWear = document.getElementById('barWear');

        const resPerTripCost = document.getElementById('resPerTripCost');
        const resPerTripFuel = document.getElementById('resPerTripFuel');
        const resPerDayCost = document.getElementById('resPerDayCost');
        const resPerDayFuel = document.getElementById('resPerDayFuel');
        const resPerWeekCost = document.getElementById('resPerWeekCost');
        const resPerWeekFuel = document.getElementById('resPerWeekFuel');
        const resPerMonthCost = document.getElementById('resPerMonthCost');
        const resPerMonthFuel = document.getElementById('resPerMonthFuel');

        const tableBreakdownBody = document.getElementById('tableBreakdownBody');
        const savedTripsContainer = document.getElementById('savedTripsContainer');
        const btnSaveTrip = document.getElementById('btnSaveTrip');
        const btnClearSavedTrips = document.getElementById('btnClearSavedTrips');
        const btnReset = document.getElementById('btnReset');
        const btnExportCSV = document.getElementById('btnExportCSV');

        let myChart = null;
        let map = null;
        let routeLayer = null;
        let originCoords = null;
        let destCoords = null;

        function initMap() {
            map = L.map('map').setView([-26.2041, 28.0473], 10); // Default Johannesburg
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '&copy; OpenStreetMap contributors'
            }).addTo(map);
        }

        function setupAutocomplete(inputEl, suggestionsEl, onSelect) {
            let debounceTimeout = null;
            inputEl.addEventListener('input', () => {
                clearTimeout(debounceTimeout);
                const query = inputEl.value.trim();
                if (query.length < 3) {
                    suggestionsEl.classList.add('hidden');
                    return;
                }
                debounceTimeout = setTimeout(() => {
                    fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}`)
                        .then(res => res.json())
                        .then(data => {
                            suggestionsEl.innerHTML = '';
                            if (data.length === 0) {
                                suggestionsEl.classList.add('hidden');
                                return;
                            }
                            data.slice(0, 5).forEach(item => {
                                const div = document.createElement('div');
                                div.className = 'p-2 text-xs hover:bg-gray-100 dark:hover:bg-gray-700 cursor-pointer text-gray-800 dark:text-gray-200 transition-colors';
                                div.textContent = item.display_name;
                                div.addEventListener('click', () => {
                                    inputEl.value = item.display_name;
                                    suggestionsEl.classList.add('hidden');
                                    onSelect({ lat: parseFloat(item.lat), lon: parseFloat(item.lon) });
                                });
                                suggestionsEl.appendChild(div);
                            });
                            suggestionsEl.classList.remove('hidden');
                        }).catch(() => suggestionsEl.classList.add('hidden'));
                }, 300);
            });

            document.addEventListener('click', (e) => {
                if (!inputEl.contains(e.target) && !suggestionsEl.contains(e.target)) {
                    suggestionsEl.classList.add('hidden');
                }
            });
        }

        function calculateOSRMRoute() {
            if (!originCoords || !destCoords) {
                routeStatusBadge.textContent = "Please select both locations";
                routeStatusBadge.className = "text-[10px] px-2 py-0.5 rounded-full bg-amber-100 text-amber-700 font-medium";
                return;
            }

            routeStatusBadge.textContent = "Fetching Route...";
            routeStatusBadge.className = "text-[10px] px-2 py-0.5 rounded-full bg-blue-100 text-blue-700 font-medium";

            const url = `https://router.project-osrm.org/route/v1/driving/${originCoords.lon},${originCoords.lat};${destCoords.lon},${destCoords.lat}?overview=full&geometries=geojson`;

            fetch(url)
                .then(res => res.json())
                .then(data => {
                    if (data.routes && data.routes.length > 0) {
                        const route = data.routes[0];
                        const distanceKm = (route.distance / 1000).toFixed(1);
                        inputDistance.value = distanceKm;

                        if (routeLayer) map.removeLayer(routeLayer);

                        routeLayer = L.geoJSON(route.geometry, {
                            style: { color: '#22c55e', weight: 5, opacity: 0.8 }
                        }).addTo(map);

                        map.fitBounds(routeLayer.getBounds(), { padding: [30, 30] });

                        routeStatusBadge.textContent = `Route Resolved: ${distanceKm} km`;
                        routeStatusBadge.className = "text-[10px] px-2 py-0.5 rounded-full bg-emerald-100 text-emerald-700 font-medium";

                        calculate();
                    } else {
                        throw new Error("No route found");
                    }
                })
                .catch(err => {
                    routeStatusBadge.textContent = "OSRM Routing Failed";
                    routeStatusBadge.className = "text-[10px] px-2 py-0.5 rounded-full bg-red-100 text-red-700 font-medium";
                });
        }

        if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
            document.documentElement.classList.add('dark');
        }
        themeToggle.addEventListener('click', () => {
            document.documentElement.classList.toggle('dark');
            calculate();
        });

        regionSelect.addEventListener('change', () => {
            const reg = regionData[regionSelect.value];
            if (reg) {
                currencySelect.value = reg.currency;
                inputFuelPrice.value = reg.fuelPrice;
                inputWearRate.value = reg.wearRate;
                calculate();
            }
        });

        function setPresetDistance(km) {
            inputDistance.value = km;
            calculate();
        }

        function calculate() {
            const currency = currencySelect.value;
            document.querySelectorAll('.currency-symbol').forEach(el => el.textContent = currency);

            const oneWayDist = parseFloat(inputDistance.value) || 0;
            const isRoundTrip = checkRoundTrip.checked;
            const tripDist = isRoundTrip ? oneWayDist * 2 : oneWayDist;

            const engineType = fuelType.value;
            const isEV = engineType === 'electric';
            const rate = parseFloat(inputConsumption.value) || 0;
            const unitText = isEV ? 'kWh' : 'L';
            const price = parseFloat(inputFuelPrice.value) || 0;

            if (isEV) {
                lblConsumption.textContent = "Energy Consumption";
                unitConsumption.textContent = "kWh/100km";
                lblFuelPrice.textContent = "Electricity Tariff";
                unitFuelPrice.textContent = "/ kWh";
            } else {
                lblConsumption.textContent = "Consumption Rate";
                unitConsumption.textContent = "L/100km";
                lblFuelPrice.textContent = "Fuel Price";
                unitFuelPrice.textContent = "/ Liter";
            }
            resFuelUnit.textContent = unitText;

            const trafficValue = parseInt(rangeTraffic.value) || 0;
            lblTrafficMargin.textContent = trafficValue >= 0 ? `+${trafficValue}%` : `${trafficValue}%`;
            const adjustedRate = rate * (1 + (trafficValue / 100));

            // Single Trip Costs
            const fuelPerTrip = (tripDist * adjustedRate) / 100;
            const fuelCostPerTrip = fuelPerTrip * price;
            const tollCostPerTrip = parseFloat(inputTolls.value) || 0;
            const wearRate = parseFloat(inputWearRate.value) || 0;
            const wearCostPerTrip = tripDist * wearRate;

            const totalCostPerTrip = fuelCostPerTrip + tollCostPerTrip + wearCostPerTrip;
            const costPerKm = tripDist > 0 ? (totalCostPerTrip / tripDist) : 0;
            const co2Factor = co2Factors[engineType] || 2.31;
            const co2PerTrip = fuelPerTrip * co2Factor;

            // Passengers
            const passengers = parseInt(rangePassengers.value) || 1;
            lblPassengers.textContent = passengers === 1 ? '1 Person (Solo)' : `${passengers} People`;

            // Timeframe Calculation
            const timeframe = timeframeSelect.value;
            let daysMultiplier = 1;
            let badgeText = "Single Trip (1 Day)";

            if (timeframe === 'custom') {
                customDaysContainer.classList.remove('hidden');
                daysMultiplier = parseInt(inputCustomDays.value) || 1;
                badgeText = `Custom Timeframe (${daysMultiplier} Days)`;
            } else {
                customDaysContainer.classList.add('hidden');
                switch (timeframe) {
                    case 'single':
                    case 'daily':
                        daysMultiplier = 1;
                        badgeText = timeframe === 'single' ? "Single Trip (1 Day)" : "Daily Commute (1 Day)";
                        break;
                    case 'workweek':
                        daysMultiplier = 5;
                        badgeText = "Weekly Work Commute (5 Days)";
                        break;
                    case 'fullweek':
                        daysMultiplier = 7;
                        badgeText = "Full Week Commute (7 Days)";
                        break;
                    case 'workmonth':
                        daysMultiplier = 22;
                        badgeText = "Monthly Work Commute (22 Days)";
                        break;
                    case 'fullmonth':
                        daysMultiplier = 30;
                        badgeText = "Full Month Total (30 Days)";
                        break;
                    case 'annual':
                        daysMultiplier = 365;
                        badgeText = "Annual Commute (365 Days)";
                        break;
                }
            }

            outputTimeframeBadge.textContent = badgeText;

            // Timeframe Totals
            const totalDistance = tripDist * daysMultiplier;
            const totalFuel = fuelPerTrip * daysMultiplier;
            const totalCost = totalCostPerTrip * daysMultiplier;
            const totalCO2 = co2PerTrip * daysMultiplier;
            const perPersonCost = totalCost / passengers;

            // Display Results
            resTotalCost.textContent = totalCost.toFixed(2);
            resPerPersonCost.textContent = perPersonCost.toFixed(2);
            resSplitDesc.textContent = passengers === 1 ? 'Solo trip (no split)' : `Split equally among ${passengers} people`;
            resTotalFuel.textContent = totalFuel.toFixed(1);
            resCostPerKmDesc.textContent = `Cost per km: ${currency}${costPerKm.toFixed(2)}`;
            resTotalDistanceDesc.textContent = `Total distance: ${totalDistance.toLocaleString()} km (${daysMultiplier} days)`;
            resCarbonFootprint.textContent = `${totalCO2.toFixed(1)} kg CO₂`;

            // Cost Composition Progress Bars
            const totalSum = (fuelCostPerTrip + tollCostPerTrip + wearCostPerTrip) || 1;
            barFuel.style.width = `${((fuelCostPerTrip / totalSum) * 100).toFixed(0)}%`;
            barTolls.style.width = `${((tollCostPerTrip / totalSum) * 100).toFixed(0)}%`;
            barWear.style.width = `${((wearCostPerTrip / totalSum) * 100).toFixed(0)}%`;

            // Quick Metrics
            resPerTripCost.textContent = totalCostPerTrip.toFixed(2);
            resPerTripFuel.textContent = `${fuelPerTrip.toFixed(1)} ${unitText}`;

            resPerDayCost.textContent = totalCostPerTrip.toFixed(2);
            resPerDayFuel.textContent = `${fuelPerTrip.toFixed(1)} ${unitText}`;

            resPerWeekCost.textContent = (totalCostPerTrip * 7).toFixed(2);
            resPerWeekFuel.textContent = `${(fuelPerTrip * 7).toFixed(1)} ${unitText}`;

            resPerMonthCost.textContent = (totalCostPerTrip * 30).toFixed(2);
            resPerMonthFuel.textContent = `${(fuelPerTrip * 30).toFixed(1)} ${unitText}`;

            // Update Table & Chart
            updateTable({ currency, tripDist, fuelPerTrip, totalCostPerTrip, co2PerTrip, unitText });
            updateChartData(totalCostPerTrip);
        }

        function updateTable(data) {
            const periods = [
                { name: 'Single Trip', days: 1 },
                { name: 'Work Week', days: 5 },
                { name: 'Full Week', days: 7 },
                { name: 'Work Month', days: 22 },
                { name: 'Full Month', days: 30 },
                { name: 'Annual', days: 365 }
            ];

            tableBreakdownBody.innerHTML = periods.map(p => {
                const dist = data.tripDist * p.days;
                const fuel = data.fuelPerTrip * p.days;
                const cost = data.totalCostPerTrip * p.days;
                const co2 = data.co2PerTrip * p.days;

                return `
                    <tr class="hover:bg-gray-50 dark:hover:bg-gray-700/40 transition-colors">
                        <td class="px-4 py-3 font-medium text-gray-900 dark:text-white">${p.name}</td>
                        <td class="px-4 py-3">${p.days}</td>
                        <td class="px-4 py-3">${dist.toLocaleString()} km</td>
                        <td class="px-4 py-3">${fuel.toFixed(1)} ${data.unitText}</td>
                        <td class="px-4 py-3">${co2.toFixed(1)} kg</td>
                        <td class="px-4 py-3 text-right font-bold text-gray-900 dark:text-white">${data.currency}${cost.toFixed(2)}</td>
                    </tr>
                `;
            }).join('');
        }

        function initChart() {
            const ctx = document.getElementById('costChart').getContext('2d');
            const isDark = document.documentElement.classList.contains('dark');

            myChart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: ['1 Trip', '1 Day', '1 Week (7d)', '1 Month (30d)', '1 Year (365d)'],
                    datasets: [{
                        label: 'Estimated Cost',
                        data: [0, 0, 0, 0, 0],
                        backgroundColor: '#22c55e',
                        borderRadius: 8,
                        hoverBackgroundColor: '#16a34a'
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { display: false },
                        tooltip: {
                            callbacks: {
                                label: (context) => {
                                    const curr = currencySelect.value;
                                    return ` Cost: ${curr}${context.parsed.y.toFixed(2)}`;
                                }
                            }
                        }
                    },
                    scales: {
                        x: {
                            grid: { display: false },
                            ticks: { color: isDark ? '#9ca3af' : '#4b5563' }
                        },
                        y: {
                            grid: { color: isDark ? 'rgba(255,255,255,0.05)' : 'rgba(0,0,0,0.05)' },
                            ticks: { color: isDark ? '#9ca3af' : '#4b5563' }
                        }
                    }
                }
            });
        }

        function updateChartData(costPerTrip) {
            if (!myChart) return;
            const data = [costPerTrip, costPerTrip, costPerTrip * 7, costPerTrip * 30, costPerTrip * 365];
            myChart.data.datasets[0].data = data;
            const isDark = document.documentElement.classList.contains('dark');
            myChart.options.scales.x.ticks.color = isDark ? '#9ca3af' : '#4b5563';
            myChart.options.scales.y.ticks.color = isDark ? '#9ca3af' : '#4b5563';
            myChart.options.scales.y.grid.color = isDark ? 'rgba(255,255,255,0.05)' : 'rgba(0,0,0,0.05)';
            myChart.update();
        }

        function getSavedTrips() {
            return JSON.parse(localStorage.getItem('fuel_trip_saved') || '[]');
        }

        function renderSavedTrips() {
            const trips = getSavedTrips();
            if (trips.length === 0) {
                savedTripsContainer.innerHTML = '<p class="text-gray-400 italic">No saved trips yet. Click "Save Trip to Library" above to store custom routes.</p>';
                return;
            }

            savedTripsContainer.innerHTML = trips.map((trip, idx) => `
                <div class="flex items-center justify-between p-3 bg-gray-50 dark:bg-gray-700/50 rounded-xl border border-gray-200 dark:border-gray-600">
                    <div>
                        <p class="font-semibold text-gray-900 dark:text-white">${trip.origin || 'Custom Origin'} ➔ ${trip.dest || 'Custom Destination'}</p>
                        <p class="text-[11px] text-gray-500 dark:text-gray-400">${trip.dist} km | ${trip.vehicle} | ${trip.currency}${trip.cost}</p>
                    </div>
                    <div class="flex space-x-2">
                        <button onclick="loadSavedTrip(${idx})" class="text-brand-600 dark:text-brand-400 font-medium hover:underline">Load</button>
                        <button onclick="deleteSavedTrip(${idx})" class="text-red-500 hover:underline">Delete</button>
                    </div>
                </div>
            `).join('');
        }

        window.loadSavedTrip = function(idx) {
            const trips = getSavedTrips();
            const trip = trips[idx];
            if (trip) {
                inputOrigin.value = trip.origin || '';
                inputDestination.value = trip.dest || '';
                inputDistance.value = trip.dist;
                calculate();
            }
        };

        window.deleteSavedTrip = function(idx) {
            const trips = getSavedTrips();
            trips.splice(idx, 1);
            localStorage.setItem('fuel_trip_saved', JSON.stringify(trips));
            renderSavedTrips();
        };

        btnSaveTrip.addEventListener('click', () => {
            const trips = getSavedTrips();
            trips.push({
                origin: inputOrigin.value,
                dest: inputDestination.value,
                dist: inputDistance.value,
                vehicle: presetVehicle.options[presetVehicle.selectedIndex].text,
                cost: resTotalCost.textContent,
                currency: currencySelect.value
            });
            localStorage.setItem('fuel_trip_saved', JSON.stringify(trips));
            renderSavedTrips();
        });

        btnClearSavedTrips.addEventListener('click', () => {
            localStorage.removeItem('fuel_trip_saved');
            renderSavedTrips();
        });

        presetVehicle.addEventListener('change', () => {
            const presetKey = presetVehicle.value;
            if (presetKey !== 'custom' && vehiclePresets[presetKey]) {
                const preset = vehiclePresets[presetKey];
                fuelType.value = preset.fuelType;
                inputConsumption.value = preset.consumption;
            }
            calculate();
        });

        setupAutocomplete(inputOrigin, originSuggestions, (coords) => { originCoords = coords; });
        setupAutocomplete(inputDestination, destSuggestions, (coords) => { destCoords = coords; });
        btnCalculateRoute.addEventListener('click', calculateOSRMRoute);

        [inputDistance, checkRoundTrip, fuelType, inputConsumption, inputFuelPrice, inputTolls, inputWearRate, rangePassengers, timeframeSelect, inputCustomDays, rangeTraffic, currencySelect].forEach(element => {
            element.addEventListener('input', calculate);
            element.addEventListener('change', calculate);
        });

        btnReset.addEventListener('click', () => {
            inputOrigin.value = '';
            inputDestination.value = '';
            inputDistance.value = '50';
            checkRoundTrip.checked = true;
            presetVehicle.value = 'custom';
            fuelType.value = 'petrol';
            inputConsumption.value = '7.2';
            inputTolls.value = '0';
            inputWearRate.value = '1.50';
            rangePassengers.value = '1';
            timeframeSelect.value = 'workweek';
            rangeTraffic.value = '0';
            calculate();
        });

        btnExportCSV.addEventListener('click', () => {
            const currency = currencySelect.value;
            const rows = [["Time Period", "Days", "Distance (km)", "Fuel Required", "CO2 Emissions (kg)", `Est. Cost (${currency})`]];
            const tbodyRows = tableBreakdownBody.querySelectorAll('tr');
            tbodyRows.forEach(row => {
                const cols = row.querySelectorAll('td');
                if (cols.length >= 6) {
                    rows.push([cols[0].innerText, cols[1].innerText, cols[2].innerText, cols[3].innerText, cols[4].innerText, cols[5].innerText.replace(currency, '')]);
                }
            });
            const csvContent = "data:text/csv;charset=utf-8," + rows.map(e => e.join(",")).join("\n");
            const link = document.createElement("a");
            link.setAttribute("href", encodeURI(csvContent));
            link.setAttribute("download", "FuelTrip_Report.csv");
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        });

        window.onload = function() {
            initMap();
            initChart();
            renderSavedTrips();
            calculate();
        };
    </script>
</body>
</html>
