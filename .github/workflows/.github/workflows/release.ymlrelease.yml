            ford_eco_sport: { fuelType: 'petrol', consumption: 6.4 },
            // Hyundai/Kia
            hyundai_i10: { fuelType: 'petrol', consumption: 5.5 },
            hyundai_tucson: { fuelType: 'petrol', consumption: 8.9 },
            kia_picanto: { fuelType: 'petrol', consumption: 5.0 },
            kia_sportage: { fuelType: 'petrol', consumption: 7.3 },
            // Luxury
            bmw_320i: { fuelType: 'petrol', consumption: 6.3 },
            bmw_320d: { fuelType: 'diesel', consumption: 4.6 },
            bmw_x5: { fuelType: 'diesel', consumption: 7.5 },
            mb_c200: { fuelType: 'petrol', consumption: 6.6 },
            audi_a3: { fuelType: 'petrol', consumption: 5.5 },
            // Nissan/Suzuki
            suzuki_swift: { fuelType: 'petrol', consumption: 4.9 },
            suzuki_jimny: { fuelType: 'petrol', consumption: 6.8 },
            isuzu_dmax: { fuelType: 'diesel', consumption: 8.4 },
            nissan_magnite: { fuelType: 'petrol', consumption: 6.0 },
            // EVs
            tesla_model_3: { fuelType: 'electric', consumption: 14.7 },
            tesla_model_y: { fuelType: 'electric', consumption: 16.9 },
            byd_atto_3: { fuelType: 'electric', consumption: 15.6 },
