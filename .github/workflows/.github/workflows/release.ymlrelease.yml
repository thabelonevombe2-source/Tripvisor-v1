<!DOCTYPE html>
<html lang="en" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FuelTrip Pro - Advanced Trip Fuel, Toll & Cost Calculator</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0fdf4',
                            100: '#dcfce7',
                            500: '#22c55e',
                            600: '#16a34a',
                            700: '#15803d',
                            800: '#166534',
                            900: '#14532d',
                        }
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Leaflet.js CSS & JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.05);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(0, 0, 0, 0.2);
            border-radius: 4px;
        }
        .dark ::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
        }
        .dark ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
        }
        #map {
            height: 320px;
            border-radius: 1rem;
            z-index: 10;
        }
        .autocomplete-suggestions {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            max-height: 200px;
            overflow-y: auto;
            z-index: 50;
        }
        @media print {
            .no-print {
                display: none !important;
            }
            body {
                background: white !important;
                color: black !important;
            }
            .print-card {
                box-shadow: none !important;
                border: 1px solid #ccc !important;
            }
        }
    </style>
</head>
<body class="bg-gray-50 dark:bg-gray-900 text-gray-800 dark:text-gray-100 min-h-screen transition-colors duration-200 pb-12">

    <header class="bg-white dark:bg-gray-800 border-b border-gray-200 dark:border-gray-700 sticky top-0 z-40 shadow-sm no-print">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="bg-brand-600 text-white p-2.5 rounded-xl shadow-md flex items-center justify-center">
                    <i class="fa-solid fa-gas-pump text-xl"></i>
                </div>
                <div>
                    <h1 class="font-bold text-lg sm:text-xl text-gray-900 dark:text-white leading-tight">FuelTrip Pro</h1>
                    <p class="text-xs text-gray-500 dark:text-gray-400">Route, Fuel, Toll & Cost Intelligence</p>
                </div>
            </div>

            <div class="flex items-center space-x-2 sm:space-x-3">
                <!-- Regional Presets Dropdown -->
                <div class="hidden md:flex items-center space-x-1.5 text-xs text-gray-500 dark:text-gray-400 mr-2">
                    <i class="fa-solid fa-globe"></i>
                    <span>Region:</span>
                </div>
                <select id="regionSelect" class="bg-gray-100 dark:bg-gray-700 border border-gray-300 dark:border-gray-600 rounded-lg px-2.5 py-1.5 text-xs sm:text-sm font-medium text-gray-700 dark:text-gray-200 focus:outline-none focus:ring-2 focus:ring-brand-500 cursor-pointer">
                    <option value="ZA" selected>🇿🇦 South Africa (ZAR)</option>
                    <option value="US">🇺🇸 United States (USD)</option>
                    <option value="UK">🇬🇧 United Kingdom (GBP)</option>
                    <option value="EU">🇪🇺 Eurozone (EUR)</option>
                    <option value="AU">🇦🇺 Australia (AUD)</option>
                    <option value="IN">🇮🇳 India (INR)</option>
                </select>

                <select id="currencySelect" class="bg-gray-100 dark:bg-gray-700 border border-gray-300 dark:border-gray-600 rounded-lg px-2 py-1.5 text-xs sm:text-sm font-medium text-gray-700 dark:text-gray-200 focus:outline-none focus:ring-2 focus:ring-brand-500 cursor-pointer">
                    <option value="R">ZAR (R)</option>
                    <option value="$">USD ($)</option>
                    <option value="€">EUR (€)</option>
                    <option value="£">GBP (£)</option>
                    <option value="A$">AUD (A$)</option>
                    <option value="₹">INR (₹)</option>
                </select>

                <button id="themeToggle" class="p-2 text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700 rounded-lg transition-colors" title="Toggle Theme">
                    <i class="fa-solid fa-moon dark:hidden text-lg"></i>
                    <i class="fa-solid fa-sun hidden dark:block text-lg text-amber-400"></i>
                </button>

                <button onclick="window.print()" class="hidden sm:flex items-center space-x-1.5 bg-gray-100 dark:bg-gray-700 hover:bg-gray-200 dark:hover:bg-gray-600 text-gray-700 dark:text-gray-200 px-3 py-1.5 rounded-lg text-xs sm:text-sm font-medium transition-colors">
                    <i class="fa-solid fa-print"></i>
                    <span>Print</span>
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 sm:py-8">

        <!-- Disclaimer Banner -->
        <div class="mb-6 p-4 bg-amber-50 dark:bg-amber-900/30 border border-amber-200 dark:border-amber-800/50 rounded-2xl flex items-start space-x-3 text-amber-800 dark:text-amber-300 text-xs sm:text-sm shadow-sm">
            <i class="fa-solid fa-circle-info text-amber-500 text-lg mt-0.5 flex-shrink-0"></i>
            <div>
                <span class="font-semibold">Live Route & Cost Estimations:</span> Route distances are calculated via <strong>OSRM / OpenStreetMap</strong>. Fuel rates, toll fees, and vehicle maintenance factors are estimates based on standard regional parameters.
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 sm:gap-8">

            <div class="lg:col-span-5 space-y-6 no-print">

                <!-- Step 1: Interactive Route Resolver -->
                <div class="bg-white dark:bg-gray-800 rounded-2xl shadow-sm border border-gray-200 dark:border-gray-700 p-5 sm:p-6">
                    <div class="flex items-center justify-between mb-4 border-b border-gray-100 dark:border-gray-700/60 pb-3">
                        <div class="flex items-center space-x-2.5 text-gray-900 dark:text-white font-semibold text-base">
                            <i class="fa-solid fa-route text-brand-600 dark:text-brand-500"></i>
                            <span>1. Route & Live GPS Map</span>
                        </div>
                        <span id="routeStatusBadge" class="text-[10px] px-2 py-0.5 rounded-full bg-gray-100 dark:bg-gray-700 text-gray-500 font-medium">Ready</span>
                    </div>

                    <div class="space-y-4">
                        <!-- Origin Input with Autocomplete -->
                        <div class="relative">
                            <label class="block text-xs font-medium text-gray-600 dark:text-gray-400 mb-1">Origin Location</label>
                            <div class="relative">
                                <input type="text" id="inputOrigin" placeholder="Type city or address..." class="w-full bg-gray-50 dark:bg-gray-700 border border-gray-300 dark:border-gray-600 rounded-xl pl-8 pr-3 py-2 text-xs sm:text-sm text-gray-800 dark:text-white focus:ring-2 focus:ring-brand-500 focus:outline-none" autocomplete="off">
                                <i class="fa-solid fa-location-dot absolute left-3 top-2.5 text-brand-600 dark:text-brand-400 text-xs"></i>
                            </div>
                            <div id="originSuggestions" class="autocomplete-suggestions bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-xl shadow-lg hidden divide-y divide-gray-100 dark:divide-gray-700"></div>
                        </div>

                        <!-- Destination Input with Autocomplete -->
                        <div class="relative">
                            <label class="block text-xs font-medium text-gray-600 dark:text-gray-400 mb-1">Destination Location</label>
                            <div class="relative">
                                <input type="text" id="inputDestination" placeholder="Type city or address..." class="w-full bg-gray-50 dark:bg-gray-700 border border-gray-300 dark:border-gray-600 rounded-xl pl-8 pr-3 py-2 text-xs sm:text-sm text-gray-800 dark:text-white focus:ring-2 focus:ring-brand-500 focus:outline-none" autocomplete="off">
                                <i class="fa-solid fa-flag-checkered absolute left-3 top-2.5 text-red-500 text-xs"></i>
                            </div>
                            <div id="destSuggestions" class="autocomplete-suggestions bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-xl shadow-lg hidden divide-y divide-gray-100 dark:divide-gray-700"></div>
                        </div>

                        <div class="flex space-x-2">
                            <button id="btnCalculateRoute" class="flex-1 bg-brand-600 hover:bg-brand-700 text-white font-medium py-2 rounded-xl text-xs sm:text-sm transition-colors flex items-center justify-center space-x-2 shadow-sm">
                                <i class="fa-solid fa-location-arrow"></i>
                                <span>Calculate GPS Route</span>
                            </button>
                        </div>

                        <!-- Manual Distance Override & Presets -->
                        <div class="pt-2 border-t border-gray-100 dark:border-gray-700/60">
                            <div class="flex items-center justify-between mb-1">
                                <label class="block text-xs font-medium text-gray-700 dark:text-gray-300">
                                    One-Way Distance <span class="text-xs text-gray-400 font-normal">(Manual / Calculated)</span>
                                </label>
                            </div>
                            <div class="relative rounded-xl shadow-sm">
                                <input type="number" id="inputDistance" min="0.1" step="0.1" value="50" class="w-full bg-gray-50 dark:bg-gray-700 border border-gray-300 dark:border-gray-600 rounded-xl pl-3 pr-14 py-2 text-sm font-bold text-gray-900 dark:text-white focus:ring-2 focus:ring-brand-500 focus:outline-none">
                                <div class="absolute inset-y-0 right-0 pr-3 flex items-center pointer-events-none text-gray-400 font-medium text-xs">
                                    km
                                </div>
                            </div>
                        </div>

                        <!-- Presets -->
                        <div class="flex flex-wrap gap-1.5">
                            <button type="button" onclick="setPresetDistance(10)" class="px-2.5 py-1 text-xs bg-gray-100 dark:bg-gray-700 hover:bg-gray-200 dark:hover:bg-gray-600 text-gray-700 dark:text-gray-200 rounded-lg font-medium transition-colors">10 km</button>
                            <button type="button" onclick="setPresetDistance(25)" class="px-2.5 py-1 text-xs bg-gray-100 dark:bg-gray-700 hover:bg-gray-200 dark:hover:bg-gray-600 text-gray-700 dark:text-gray-200 rounded-lg font-medium transition-colors">25 km</button>
                            <button type="button" onclick="setPresetDistance(50)" class="px-2.5 py-1 text-xs bg-gray-100 dark:bg-gray-700 hover:bg-gray-200 dark:hover:bg-gray-600 text-gray-700 dark:text-gray-200 rounded-lg font-medium transition-colors">50 km</button>
                            <button type="button" onclick="setPresetDistance(100)" class="px-2.5 py-1 text-xs bg-gray-100 dark:bg-gray-700 hover:bg-gray-200 dark:hover:bg-gray-600 text-gray-700 dark:text-gray-200 rounded-lg font-medium transition-colors">100 km</button>
                            <button type="button" onclick="setPresetDistance(250)" class="px-2.5 py-1 text-xs bg-gray-100 dark:bg-gray-700 hover:bg-gray-200 dark:hover:bg-gray-600 text-gray-700 dark:text-gray-200 rounded-lg font-medium transition-colors">250 km</button>
                        </div>

                        <div class="flex items-center justify-between p-3 bg-gray-50 dark:bg-gray-700/50 rounded-xl border border-gray-200 dark:border-gray-600/50">
                            <div class="flex items-center space-x-2.5">
                                <i class="fa-solid fa-arrows-left-right text-gray-500 dark:text-gray-400"></i>
                                <span class="text-xs sm:text-sm font-medium text-gray-700 dark:text-gray-200">Include Return Trip?</span>
                            </div>
                            <label class="relative inline-flex items-center cursor-pointer">
                                <input type="checkbox" id="checkRoundTrip" checked class="sr-only peer">
                                <div class="w-11 h-6 bg-gray-300 peer-focus:outline-none rounded-full peer dark:bg-gray-600 peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all dark:after:border-gray-600 peer-checked:bg-brand-600"></div>
                            </label>
                        </div>

                        <!-- Leaflet Interactive Map Container -->
                        <div class="mt-3">
                            <div id="map"></div>
                        </div>
                    </div>
                </div>

                <!-- Step 2: Vehicle Database & Fuel Spec -->
                <div class="bg-white dark:bg-gray-800 rounded-2xl shadow-sm border border-gray-200 dark:border-gray-700 p-5 sm:p-6">
                    <div class="flex items-center space-x-2.5 mb-4 text-gray-900 dark:text-white font-semibold text-base border-b border-gray-100 dark:border-gray-700/60 pb-3">
                        <i class="fa-solid fa-car text-brand-600 dark:text-brand-500"></i>
                        <span>2. Vehicle & Fuel Database</span>
                    </div>

                    <div class="space-y-4">
                        <!-- Vehicle Search & Dropdown -->
                        <div>
                            <label class="block text-xs font-medium text-gray-600 dark:text-gray-400 mb-1">Select from 50+ Car Models</label>
                            <select id="presetVehicle" class="w-full bg-gray-50 dark:bg-gray-700 border border-gray-300 dark:border-gray-600 rounded-xl px-3 py-2 text-xs sm:text-sm text-gray-800 dark:text-white focus:ring-2 focus:ring-brand-500 focus:outline-none cursor-pointer">
                                <option value="custom">-- Custom Specification --</option>
                                <optgroup label="Toyota">
                                    <option value="toyota_hilux">Toyota Hilux 2.8GD-6 (Diesel 9.2 L/100km)</option>
                                    <option value="toyota_corolla">Toyota Corolla Quest 1.8 (Petrol 7.0 L/100km)</option>
                                    <option value="toyota_corolla_cross">Toyota Corolla Cross Hybrid (3.9 L/100km)</option>
                                    <option value="toyota_fortuner">Toyota Fortuner 2.8D (Diesel 8.6 L/100km)</option>
                                    <option value="toyota_yaris">Toyota Yaris 1.5 (Petrol 5.9 L/100km)</option>
                                    <option value="toyota_starlet">Toyota Starlet 1.5 (Petrol 5.4 L/100km)</option>
                                </optgroup>
                                <optgroup label="Volkswagen">
                                    <option value="vw_polo">VW Polo 1.0 TSI (Petrol 5.3 L/100km)</option>
                                    <option value="vw_polo_vivo">VW Polo Vivo 1.4 (Petrol 5.7 L/100km)</option>
                                    <option value="vw_tiguan">VW Tiguan 2.0 TSI (Petrol 7.8 L/100km)</option>
                                    <option value="vw_amarok">VW Amarok 3.0 V6 TDI (Diesel 9.5 L/100km)</option>
                                    <option value="vw_golf_gti">VW Golf 8 GTI (Petrol 7.0 L/100km)</option>
                                </optgroup>
                                <optgroup label="Ford">
                                    <option value="ford_ranger">Ford Ranger 2.0 Bi-Turbo (Diesel 8.8 L/100km)</option>
                                    <option value="ford_everest">Ford Everest 3.0 V6 (Diesel 9.7 L/100km)</option>
                                    <option value="ford_eco_sport">Ford EcoSport 1.5 (Petrol 6.4 L/100km)</option>
                                </optgroup>
                                <optgroup label="Hyundai / Kia">
                                    <option value="hyundai_i10">Hyundai Grand i10 1.0 (Petrol 5.5 L/100km)</option>
                                    <option value="hyundai_tucson">Hyundai Tucson 2.0 (Petrol 8.9 L/100km)</option>
                                    <option value="kia_picanto">Kia Picanto 1.0 (Petrol 5.0 L/100km)</option>
                                    <option value="kia_sportage">Kia Sportage 1.6 T-GDI (Petrol 7.3 L/100km)</option>
                                </optgroup>
                                <optgroup label="BMW / Mercedes / Audi">
                                    <option value="bmw_320i">BMW 320i Sedan (Petrol 6.3 L/100km)</option>
                                    <option value="bmw_320d">BMW 320d Diesel (Diesel 4.6 L/100km)</option>
                                    <option value="bmw_x5">BMW X5 xDrive30d (Diesel 7.5 L/100km)</option>
                                    <option value="mb_c200">Mercedes-Benz C200 (Petrol 6.6 L/100km)</option>
                                    <option value="audi_a3">Audi A3 35 TFSI (Petrol 5.5 L/100km)</option>
                                </optgroup>
                                <optgroup label="Nissan / Suzuki / Isuzu">
                                    <option value="suzuki_swift">Suzuki Swift 1.2 (Petrol 4.9 L/100km)</option>
                                    <option value="suzuki_jimny">Suzuki Jimny 1.5 (Petrol 6.8 L/100km)</option>
                                    <option value="isuzu_dmax">Isuzu D-Max 3.0 DDI (Diesel 8.4 L/100km)</option>
                                    <option value="nissan_magnite">Nissan Magnite 1.0T (Petrol 6.0 L/100km)</option>
                                </optgroup>
                                <optgroup label="Electric Vehicles (EV)">
                                    <option value="tesla_model_3">Tesla Model 3 Long Range (EV 14.7 kWh/100km)</option>
                                    <option value="tesla_model_y">Tesla Model Y Dual Motor (EV 16.9 kWh/100km)</option>
                                    <option value="byd_atto_3">BYD Atto 3 (EV 15.6 kWh/100km)</option>
                                    <option value="ora_cat">GWM Ora 03 / Funky Cat (EV 16.5 kWh/100km)</option>
                                    <option value="bmw_ix3">BMW iX3 Electric (EV 18.5 kWh/100km)</option>
                                </optgroup>
                            </select>
                        </div>

                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                            <div>
                                <label class="block text-xs font-medium text-gray-600 dark:text-gray-400 mb-1">Engine / Fuel Type</label>
                                <select id="fuelType" class="w-full bg-gray-50 dark:bg-gray-700 border border-gray-300 dark:border-gray-600 rounded-xl px-3 py-2 text-xs sm:text-sm text-gray-800 dark:text-white focus:ring-2 focus:ring-brand-500 focus:outline-none">
                                    <option value="petrol" selected>Petrol (Unleaded)</option>
                                    <option value="diesel">Diesel</option>
                                    <option value="electric">Electric (EV)</option>
                                    <option value="hybrid">Hybrid</option>
                                </select>
                            </div>

                            <div>
                                <label class="block text-xs font-medium text-gray-600 dark:text-gray-400 mb-1" id="lblConsumption">Consumption Rate</label>
                                <div class="relative rounded-xl shadow-sm">
                                    <input type="number" id="inputConsumption" min="0.5" step="0.1" value="7.2" class="w-full bg-gray-50 dark:bg-gray-700 border border-gray-300 dark:border-gray-600 rounded-xl pl-3 pr-16 py-2 text-xs sm:text-sm font-semibold text-gray-900 dark:text-white focus:ring-2 focus:ring-brand-500 focus:outline-none">
                                    <div class="absolute inset-y-0 right-0 pr-3 flex items-center pointer-events-none text-gray-400 text-xs font-medium" id="unitConsumption">
                                        L/100km
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div>
                            <label class="block text-xs font-medium text-gray-600 dark:text-gray-400 mb-1" id="lblFuelPrice">Fuel Price / Electricity Tariff</label>
                            <div class="relative rounded-xl shadow-sm">
                                <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-gray-400 font-semibold text-xs sm:text-sm currency-symbol">
                                    R
                                </div>
                                <input type="number" id="inputFuelPrice" min="0.01" step="0.01" value="23.50" class="w-full bg-gray-50 dark:bg-gray-700 border border-gray-300 dark:border-gray-600 rounded-xl pl-8 pr-16 py-2 text-xs sm:text-sm font-semibold text-gray-900 dark:text-white focus:ring-2 focus:ring-brand-500 focus:outline-none">
                                <div class="absolute inset-y-0 right-0 pr-3 flex items-center pointer-events-none text-gray-400 text-xs font-medium" id="unitFuelPrice">
                                    / Liter
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Step 3: Tolls, Wear & Tear & Passenger Split -->
                <div class="bg-white dark:bg-gray-800 rounded-2xl shadow-sm border border-gray-200 dark:border-gray-700 p-5 sm:p-6">
                    <div class="flex items-center space-x-2.5 mb-4 text-gray-900 dark:text-white font-semibold text-base border-b border-gray-100 dark:border-gray-700/60 pb-3">
                        <i class="fa-solid fa-calculator text-brand-600 dark:text-brand-500"></i>
                        <span>3. Tolls, Wear & Passenger Split</span>
                    </div>

                    <div class="space-y-4">
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                            <div>
                                <label class="block text-xs font-medium text-gray-600 dark:text-gray-400 mb-1">Toll Fees Total</label>
                                <div class="relative rounded-xl shadow-sm">
                                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-gray-400 font-semibold text-xs currency-symbol">R</div>
                                    <input type="number" id="inputTolls" min="0" step="1" value="0" class="w-full bg-gray-50 dark:bg-gray-700 border border-gray-300 dark:border-gray-600 rounded-xl pl-7 pr-3 py-2 text-xs sm:text-sm font-semibold text-gray-900 dark:text-white focus:ring-2 focus:ring-brand-500 focus:outline-none">
                                </div>
                            </div>

                            <div>
                                <label class="block text-xs font-medium text-gray-600 dark:text-gray-400 mb-1">
                                    Wear & Tear / Depreciation
                                    <span class="text-[10px] text-gray-400">(per km)</span>
                                </label>
                                <div class="relative rounded-xl shadow-sm">
                                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-gray-400 font-semibold text-xs currency-symbol">R</div>
                                    <input type="number" id="inputWearRate" min="0" step="0.05" value="1.50" class="w-full bg-gray-50 dark:bg-gray-700 border border-gray-300 dark:border-gray-600 rounded-xl pl-7 pr-12 py-2 text-xs sm:text-sm font-semibold text-gray-900 dark:text-white focus:ring-2 focus:ring-brand-500 focus:outline-none">
                                    <div class="absolute inset-y-0 right-0 pr-2 flex items-center pointer-events-none text-gray-400 text-[10px]">/km</div>
                                </div>
                            </div>
                        </div>

                        <!-- Passenger Splitter -->
                        <div class="p-3 bg-brand-50/50 dark:bg-brand-900/10 rounded-xl border border-brand-100 dark:border-brand-800/30">
                            <div class="flex items-center justify-between mb-2">
                                <label class="text-xs font-semibold text-brand-900 dark:text-brand-300 flex items-center space-x-1.5">
                                    <i class="fa-solid fa-users"></i>
                                    <span>Passenger Cost Splitter</span>
                                </label>
                                <span id="lblPassengers" class="text-xs font-bold text-brand-600 dark:text-brand-400">1 Person (Solo)</span>
                            </div>
                            <input type="range" id="rangePassengers" min="1" max="10" step="1" value="1" class="w-full accent-brand-600 bg-gray-200 dark:bg-gray-700 h-2 rounded-lg cursor-pointer">
                            <div class="flex justify-between text-[10px] text-gray-400 mt-1">
                                <span>Solo (1)</span>
                                <span>5 People</span>
                                <span>10 People</span>
                            </div>
                        </div>

                        <!-- Timeframe Selection -->
                        <div>
                            <label class="block text-xs font-medium text-gray-600 dark:text-gray-400 mb-1">Timeframe Projection</label>
